# Clean-clone build of the desktop demo: fetch submodules, build raylib from
# source, build clay-widgets-demo.exe. Catches missing-submodule and
# broken-include regressions that a warm local checkout hides.
name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-toolchain

      - name: Run headless widget tests
        run: make test

      - name: Generate the single-header amalgam and test against it
        run: make test-amalgam

      - name: Build raylib + demo
        run: make -j4

      - name: Verify the binary was produced
        run: test -f clay-widgets-demo.exe

      - uses: actions/upload-artifact@v4
        with:
          name: clay-widgets-demo
          path: clay-widgets-demo.exe

      # The distributable single-file library: drop clay-widgets.h next to
      # clay.h in any project. Only uploaded after the full unit-test suite
      # passed against this exact generated file.
      - uses: actions/upload-artifact@v4
        with:
          name: clay-widgets-single-header
          path: build/clay-widgets.h
