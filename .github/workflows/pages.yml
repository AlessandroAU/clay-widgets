# Builds the WebAssembly demo and publishes it to GitHub Pages, so the same
# raylib app that ships as clay-widgets-demo.exe is playable in a browser at
# https://alessandroau.github.io/clay-widgets/. The README screenshots are
# published alongside it under /screenshots/, so CI never commits to the repo.
#
# Requires Pages to be enabled once for the repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a newer commit supersedes an in-flight
# build, but let the running one finish so Pages is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs + activates emsdk and puts emcc on PATH, with its own cache so
      # the ~1GB SDK download only happens when the version changes.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the web demo
        run: python tools/build_web.py --system-emsdk

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  # Regenerates the README screenshots from the same demo, so they can never
  # drift from what main actually renders. GitHub runners have no GPU, so this
  # builds the desktop demo for Linux and runs it under Xvfb with Mesa's
  # llvmpipe software rasterizer.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install X11/GL build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev             libgl1-mesa-dev libasound2-dev xvfb libgl1-mesa-dri

      - name: Build raylib + demo for Linux
        run: make -j4

      - name: Capture each view
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" python3 tools/screenshot_panels.py --out build/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots

  # Assembles the web demo and the screenshots into one site and deploys it.
  deploy:
    needs: [web, screenshots]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: site/screenshots

      # Pages serves through Jekyll by default, which skips files starting with
      # "_". The emscripten output has none today, but this keeps it verbatim.
      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
